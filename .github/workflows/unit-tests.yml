# Runs the unit suite on every push and pull request. Each test runs the
# corresponding published legacy code beside the consolidated function and
# requires identical output - bitwise, draw for draw under a fixed seed - so this
# is the job that keeps the repository's central claim honest between releases.
#
# MATLAB is licensed automatically here because this repository is PUBLIC:
# matlab-actions licenses all products for public projects, with no token and no
# account. A private fork would need an MLM_LICENSE_TOKEN secret instead.
#
# TWO TESTS ARE SKIPPED, deliberately and visibly, for the same single reason:
# both run legacy code that calls xlsread WITH A RANGE ARGUMENT. Without Excel
# installed - which no hosted runner has, on any OS - MATLAB falls back to basic
# import mode, which reads only XLS(X/M) and rejects a range argument outright.
# Both tests are therefore impossible on a runner rather than merely failing on
# one, and they stay local tests.
#
#   test_forecast_iterate_springer - twenty xlsread range calls over the
#     Springer real-time vintages, six against genuine OLE2/BIFF .xls and a .csv.
#   test_hybtvp_equivalence - main_HYB_TVPSV.m reads macrodata_Q_2018Q4.csv as
#     xlsread(file,'A1:IN238'). The functionized run_all keeps that exact call
#     on purpose: readmatrix disagrees with xlsread in the last bit of some
#     cells here, which is enough to break the draw-for-draw guarantee the test
#     exists to check. Fidelity to the published code and runnability on a
#     hosted runner are simply in conflict for this package, and fidelity wins.
#
# The runner prints each skip and the summary line counts them, so a green tick
# here never reads as full coverage.
name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          products: >
            Statistics_and_Machine_Learning_Toolbox
            Optimization_Toolbox

      - name: Run the unit suite
        uses: matlab-actions/run-command@v2
        env:
          BVAR_SKIP_TESTS: test_forecast_iterate_springer,test_hybtvp_equivalence
        with:
          command: run('tests/unit/run_unit_tests.m')
